<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b0a">
<title>数术西行 · 天书残卷</title>
<style>
:root{
  --ink:#0d0b0a;
  --ink2:#14110f;
  --ink3:#1c1815;
  --paper:#e8e0cf;
  --paper-dim:#b9ae99;
  --cinnabar:#c0392b;
  --gold:#c9a227;
  --jade:#3f7d7a;
  --line:rgba(201,162,39,.26);
  --line-soft:rgba(232,224,207,.12);
  --shadow:0 18px 50px rgba(0,0,0,.42);
  --song:"Songti SC","STSong","SimSun","Songti TC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","FangSong","STFangsong",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  margin:0;
  min-height:100vh;
  color:var(--paper);
  background:
    radial-gradient(ellipse at 50% -12%,rgba(201,162,39,.10),transparent 52%),
    radial-gradient(ellipse at 108% 44%,rgba(63,125,122,.08),transparent 48%),
    radial-gradient(ellipse at -12% 86%,rgba(192,57,43,.06),transparent 44%),
    var(--ink);
  font-family:var(--kai);
  font-size:16px;
  line-height:1.7;
  letter-spacing:.035em;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:.5;
  background:
    repeating-linear-gradient(135deg,transparent 0 27px,rgba(232,224,207,.018) 27px 28px),
    repeating-linear-gradient(45deg,transparent 0 41px,rgba(201,162,39,.012) 41px 42px);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.34) 100%);
}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
::selection{background:var(--cinnabar);color:var(--paper)}
#app,.modal-root,.toast,.fx{position:relative;z-index:2}
.view{width:100%;animation:inkIn .28s ease-out}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:22px 18px 40px}
.song{font-family:var(--song)}
.muted{color:var(--paper-dim)}
.gold{color:var(--gold)}
.cinnabar{color:var(--cinnabar)}
.jade{color:var(--jade)}
.tiny{font-size:12px;line-height:1.6;letter-spacing:.08em}
.small{font-size:13.5px}
.center{text-align:center}
.hidden{display:none !important}
[hidden]{display:none !important}
.nowrap{white-space:nowrap}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0}
.hair{height:1px;background:var(--line-soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt18{margin-top:18px}.mt24{margin-top:24px}

@keyframes inkIn{
  from{opacity:0;filter:blur(3px);transform:translateY(4px)}
  to{opacity:1;filter:none;transform:none}
}
@keyframes goldSweep{
  from{transform:translateX(-120%)}
  to{transform:translateX(120%)}
}
@keyframes stampIn{
  0%{opacity:0;transform:scale(1.28) rotate(-3deg)}
  62%{opacity:1;transform:scale(.97) rotate(-2deg)}
  100%{opacity:1;transform:scale(1) rotate(-2deg)}
}
@keyframes dustOut{
  0%{opacity:0;transform:translate(0,0) scale(.7)}
  30%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ——— 壳与页眉 ——— */
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:14px 0 12px;border-bottom:1px solid var(--line-soft);
}
.brand-mini{font-family:var(--song);letter-spacing:.16em;font-size:15px;color:var(--paper)}
.brand-mini span{color:var(--gold)}
.player-line{font-size:13px;color:var(--paper-dim);text-align:right;letter-spacing:.08em}
.player-line b{color:var(--paper);font-weight:400}
.icon-btn{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--paper-dim);
  width:34px;height:34px;padding:0;cursor:pointer;font-size:12px;line-height:1;flex:none;
  position:relative;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn.on{color:var(--gold);border-color:var(--gold)}
.nav-strip{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.nav-strip .btn{flex:1 1 auto;padding:10px 8px;font-size:13.5px}
.resource-strip{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border:1px solid var(--line-soft);border-top:0;margin-top:0;
}
.resource-cell{padding:9px 8px;text-align:center;border-right:1px solid var(--line-soft);min-width:0}
.resource-cell:last-child{border-right:0}
.resource-cell .k{font-size:11px;color:var(--paper-dim);letter-spacing:.14em;display:block}
.resource-cell .v{font-family:var(--song);font-size:17px;color:var(--gold);letter-spacing:.05em}

/* ——— 按钮：印章 ——— */
.btn{
  appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:42px;padding:10px 16px;border:1px solid rgba(201,162,39,.48);
  background:linear-gradient(180deg,rgba(232,224,207,.045),rgba(232,224,207,.015));
  color:var(--paper);font-family:var(--kai);letter-spacing:.14em;font-size:14.5px;
  border-radius:0;cursor:pointer;position:relative;text-decoration:none;
  transition:background .18s ease,border-color .18s ease,color .18s ease;
}
.btn::after{
  content:"";position:absolute;inset:3px;border:1px solid rgba(201,162,39,.12);pointer-events:none;
}
.btn:hover{border-color:var(--gold);background:rgba(201,162,39,.08)}
.btn:active{background:rgba(201,162,39,.14)}
.btn:disabled{opacity:.38;cursor:not-allowed;background:transparent}
.btn-main{
  background:var(--cinnabar);border-color:var(--cinnabar);color:#f3ead8;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 7px 20px rgba(192,57,43,.18);
}
.btn-main::after{border-color:rgba(243,234,216,.28)}
.btn-main:hover{background:#cf4132;border-color:#cf4132}
.btn-gold{border-color:var(--gold);color:var(--gold)}
.btn-ghost{background:transparent;border-color:var(--line-soft);color:var(--paper-dim)}
.btn-ghost:hover{border-color:var(--line);color:var(--paper)}
.btn-wide{width:100%}
.btn-sm{min-height:34px;padding:7px 11px;font-size:12.5px;letter-spacing:.1em}
.btn-seal{
  width:100%;min-height:54px;font-family:var(--song);font-size:19px;letter-spacing:.28em;
  background:var(--cinnabar);border:0;color:var(--paper);
  box-shadow:inset 0 0 0 1px rgba(243,234,216,.22),inset 0 0 0 4px var(--cinnabar),inset 0 0 0 5px rgba(243,234,216,.25);
}
.btn-seal:hover{background:#cf4132}
.linkish{
  appearance:none;border:0;background:none;padding:2px;color:var(--paper-dim);
  font-family:var(--kai);font-size:12.5px;letter-spacing:.08em;cursor:pointer;
  border-bottom:1px solid transparent;
}
.linkish:hover{color:var(--gold);border-bottom-color:var(--gold)}

/* ——— 封面 ——— */
.home{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:26px 18px 34px;position:relative;overflow:hidden}
.home-inner{width:100%;max-width:760px;position:relative;padding-bottom:76px}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:clamp(20px,7vh,60px)}
.home-mark{font-size:11px;letter-spacing:.42em;color:var(--paper-dim)}
.home-mark b{display:block;color:var(--gold);font-weight:400;letter-spacing:.3em;margin-top:5px}
.title-block{position:relative;padding:8px 0 18px}
.title-block::before{
  content:"";position:absolute;left:-18px;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.48;
}
.title-main{
  font-family:var(--song);font-weight:400;margin:0;
  font-size:clamp(48px,14.6vw,92px);line-height:1.02;letter-spacing:.14em;
  color:var(--paper);text-shadow:0 3px 24px rgba(201,162,39,.08);
}
.title-sub{
  display:flex;align-items:center;gap:15px;margin-top:10px;
  font-family:var(--song);font-size:clamp(18px,4.8vw,25px);letter-spacing:.48em;color:var(--gold);
}
.title-sub::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--gold),transparent);opacity:.38}
.cover-rule{width:64px;height:3px;background:var(--cinnabar);margin:22px 0 18px;position:relative}
.cover-rule::after{content:"";position:absolute;left:72px;top:1px;width:34px;height:1px;background:var(--gold);opacity:.5}
.lede{max-width:34em;color:var(--paper-dim);font-size:15px;line-height:2;margin:0 0 28px;letter-spacing:.08em}
.lede b{color:var(--paper);font-weight:400}
.name-field{display:flex;flex-direction:column;gap:7px;margin:0 0 18px;max-width:380px}
.name-field label{font-size:11.5px;letter-spacing:.24em;color:var(--paper-dim)}
.name-input{
  width:100%;background:rgba(232,224,207,.035);border:0;border-bottom:1px solid var(--gold);
  padding:10px 2px;font-family:var(--song);font-size:22px;letter-spacing:.16em;color:var(--paper);
  border-radius:0;
}
.name-input::placeholder{color:rgba(232,224,207,.2);letter-spacing:.12em}
.home-actions{display:flex;flex-direction:column;gap:10px;max-width:380px}
.home-foot{margin-top:30px;display:flex;justify-content:space-between;align-items:end;gap:12px;color:var(--paper-dim);font-size:11px;letter-spacing:.1em}
.vertical-whisper{
  position:absolute;right:-2px;top:108px;writing-mode:vertical-rl;font-family:var(--song);
  color:rgba(232,224,207,.12);font-size:13px;letter-spacing:.55em;pointer-events:none;
}
.home-cloud{
  position:absolute;left:-30%;right:-30%;bottom:-38%;height:57%;pointer-events:none;opacity:.4;
  background:
    radial-gradient(ellipse at 30% 40%,rgba(63,125,122,.13),transparent 55%),
    radial-gradient(ellipse at 70% 62%,rgba(201,162,39,.08),transparent 54%);
  filter:blur(8px);
}
.seal-corner{
  position:absolute;right:2px;bottom:6px;width:58px;height:58px;border:2px solid var(--cinnabar);
  display:grid;place-items:center;color:var(--cinnabar);font-family:var(--song);font-size:20px;
  letter-spacing:0;transform:rotate(-3deg);opacity:.82;
  box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 4px var(--cinnabar);
}
.seal-corner span{display:block;text-align:center;line-height:1.08;font-size:16px;letter-spacing:.02em;writing-mode:horizontal-tb}

/* ——— 路引 ——— */
.journey-head{margin:18px 0 20px;position:relative}
.journey-title{font-family:var(--song);font-size:clamp(28px,7vw,42px);letter-spacing:.2em;margin:0;font-weight:400}
.journey-sub{font-size:12px;color:var(--paper-dim);letter-spacing:.2em;margin-top:6px}
.chapter-list{border-top:1px solid var(--line);margin-top:8px}
.chapter{
  width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;align-items:center;
  padding:15px 2px;border:0;border-bottom:1px solid var(--line-soft);background:transparent;
  text-align:left;cursor:pointer;color:var(--paper);position:relative;
}
.chapter::after{
  content:"›";color:rgba(201,162,39,.25);font-size:19px;margin-left:5px;
  grid-column:4;grid-row:1;
}
.chapter:hover{background:linear-gradient(90deg,transparent,rgba(201,162,39,.045),transparent)}
.chapter:hover .ch-title{color:var(--gold)}
.chapter.locked{cursor:not-allowed;opacity:.42}
.chapter.locked::after{content:"锁";font-size:10px;letter-spacing:.1em;color:var(--paper-dim)}
.chapter.done .ch-no{border-color:var(--jade);color:var(--jade)}
.chapter.current .ch-no{background:var(--cinnabar);color:var(--paper);border-color:var(--cinnabar);box-shadow:0 0 22px rgba(192,57,43,.25)}
.ch-no{
  width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--song);font-size:15px;color:var(--gold);flex:none;
}
.ch-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.ch-title{font-family:var(--song);font-size:18px;letter-spacing:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-meta{font-size:11.5px;color:var(--paper-dim);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-state{font-size:11px;color:var(--paper-dim);text-align:right;white-space:nowrap;letter-spacing:.04em}
.ch-state .st{color:var(--gold);letter-spacing:.12em}
.ch-state .done-tag{color:var(--jade);border:1px solid rgba(63,125,122,.55);padding:1px 5px;font-size:10px}
.quote-slab{
  border-left:2px solid var(--cinnabar);padding:5px 0 5px 14px;margin:20px 0 6px;
  color:var(--paper-dim);font-size:13px;line-height:1.9;
}
.quote-slab b{color:var(--paper);font-weight:400}
.footer-small{margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:12px}
.footer-small .tiny{color:rgba(232,224,207,.32)}
.parent-link{font-size:10.5px;color:rgba(232,224,207,.28);border-bottom:1px solid transparent}
.parent-link:hover{color:var(--paper-dim);border-bottom-color:var(--line)}

/* ——— 卷首 ——— */
.story-head{padding:20px 0 0}
.volume-eyebrow{color:var(--cinnabar);font-family:var(--song);letter-spacing:.4em;font-size:12px}
.story-title{font-family:var(--song);font-weight:400;font-size:clamp(30px,8.3vw,50px);letter-spacing:.12em;margin:8px 0 4px;line-height:1.25}
.story-guard{color:var(--paper-dim);font-size:12.5px;letter-spacing:.14em}
.intro-card{border-top:1px solid var(--line);border-bottom:1px solid var(--line-soft);padding:22px 0;margin:20px 0 6px;position:relative}
.intro-card::before{
  content:"引";position:absolute;right:0;top:12px;font-family:var(--song);font-size:54px;
  color:rgba(232,224,207,.035);line-height:1;pointer-events:none;
}
.story-intro{margin:0;font-size:16px;line-height:2.1;text-indent:2em;color:rgba(232,224,207,.9);letter-spacing:.08em;position:relative}
.dialogue{display:flex;flex-direction:column;gap:0;margin:18px 0 8px;border-left:1px solid var(--line);padding-left:18px}
.dlg{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid rgba(232,224,207,.055)}
.dlg:last-child{border-bottom:0}
.dlg-speaker{font-family:var(--song);color:var(--gold);letter-spacing:.12em;font-size:15px;white-space:nowrap}
.dlg-text{color:var(--paper);font-size:15.5px;line-height:1.9;min-width:0}
.dlg-text .you{color:var(--jade)}
.volume-rule{display:flex;gap:20px;flex-wrap:wrap;border:1px solid var(--line-soft);padding:12px 14px;margin:20px 0;color:var(--paper-dim);font-size:12px}
.volume-rule b{color:var(--gold);font-weight:400}
.story-actions{display:flex;flex-direction:column;gap:9px;margin-top:18px}

/* ——— 斗法 ——— */
.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fighter{border:1px solid var(--line-soft);padding:10px 11px;min-width:0;background:rgba(232,224,207,.018)}
.fighter .f-k{font-size:10.5px;letter-spacing:.16em;color:var(--paper-dim);display:flex;justify-content:space-between;gap:7px}
.fighter .f-n{font-family:var(--song);font-size:16px;letter-spacing:.08em;margin:2px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fighter.enemy{border-color:rgba(192,57,43,.34)}
.fighter.self{border-color:rgba(63,125,122,.36)}
.qi-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.pip{display:block;width:9px;height:15px;border:1px solid rgba(201,162,39,.45);background:transparent}
.pip.on{background:var(--cinnabar);border-color:var(--cinnabar)}
.fighter.self .pip{border-color:rgba(63,125,122,.5)}
.fighter.self .pip.on{background:var(--jade);border-color:var(--jade)}
.qi-num{font-family:var(--song);font-size:13px;color:var(--paper-dim);margin-left:4px}
.combo-line{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--paper-dim);letter-spacing:.07em;margin:4px 0 10px}
.combo-line b{color:var(--gold);font-weight:400}
.timer-track{height:5px;background:rgba(232,224,207,.08);overflow:hidden;position:relative}
.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,#8e7420,var(--gold),#e2c766);transform-origin:left;transition:width .1s linear,background .25s ease}
.timer-fill.low{background:linear-gradient(90deg,#7e241b,var(--cinnabar),#df5c4a)}
.battle-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px;font-size:11px;color:var(--paper-dim);letter-spacing:.08em}
.q-panel{padding:18px 0 0;position:relative}
.q-no{font-family:var(--song);color:var(--cinnabar);font-size:12px;letter-spacing:.22em;margin-bottom:9px}
.q-stem{
  font-family:var(--song);font-size:clamp(20px,5.4vw,28px);line-height:1.65;letter-spacing:.035em;
  margin:0 0 20px;min-height:2.5em;overflow-wrap:anywhere;
}
.q-stem .num{color:var(--gold);letter-spacing:.02em}
.options{display:grid;grid-template-columns:1fr;gap:9px}
.option{
  display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:11px;
  width:100%;padding:13px 12px;background:rgba(232,224,207,.025);border:1px solid var(--line-soft);
  color:var(--paper);text-align:left;cursor:pointer;border-radius:0;
  font-family:var(--kai);font-size:16px;line-height:1.55;letter-spacing:.04em;
  transition:border-color .16s ease,background .16s ease;
}
.option:hover{border-color:rgba(201,162,39,.64);background:rgba(201,162,39,.055)}
.option .mark{
  width:24px;height:24px;border:1px solid rgba(201,162,39,.34);display:grid;place-items:center;
  font-family:var(--song);font-size:12px;color:var(--gold);flex:none;
}
.option.correct{border-color:var(--jade);background:rgba(63,125,122,.15)}
.option.correct .mark{border-color:var(--jade);color:var(--jade)}
.option.wrong{border-color:var(--cinnabar);background:rgba(192,57,43,.12)}
.option.wrong .mark{border-color:var(--cinnabar);color:var(--cinnabar)}
.option:disabled{cursor:default}
.feedback{border-top:1px solid var(--line);margin-top:16px;padding:15px 0 2px;animation:inkIn .25s ease-out both}
.feedback.good{border-color:rgba(63,125,122,.65)}
.feedback.bad{border-color:rgba(192,57,43,.65)}
.q-panel .feedback{
  position:fixed;left:0;right:0;bottom:0;z-index:20;width:100%;max-width:900px;margin:0 auto;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(20,17,15,.985),rgba(13,11,10,.99));
  border:1px solid var(--line);border-bottom:0;box-shadow:0 -18px 44px rgba(0,0,0,.52);
  max-height:52svh;overflow:auto;
}
.q-panel .feedback.good{border-color:rgba(63,125,122,.68);border-bottom:0}
.q-panel .feedback.bad{border-color:rgba(192,57,43,.7);border-bottom:0}
.q-panel .feedback .fb-actions{position:sticky;bottom:0;padding-top:9px;margin-top:8px;background:linear-gradient(180deg,transparent,rgba(13,11,10,.98) 34%)}
.fb-line{font-family:var(--song);font-size:19px;letter-spacing:.08em;color:var(--gold);margin:0 0 5px}
.feedback.bad .fb-line{color:var(--cinnabar)}
.fb-teach{border-left:1px solid var(--line);padding-left:11px;margin-top:9px;color:var(--paper-dim);font-size:13.5px;line-height:1.85}
.fb-teach b{color:var(--paper);font-weight:400;letter-spacing:.08em}
.fb-actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end}

.battle-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:11px}
.battle-foot .tiny{color:rgba(232,224,207,.32)}

/* ——— 结算 ——— */
.result{min-height:calc(100vh - 20px);min-height:calc(100svh - 20px);display:flex;flex-direction:column;justify-content:center;padding-top:28px;padding-bottom:30px}
.verdict-wrap{text-align:center;position:relative;padding:6px 0 16px}
.verdict{
  width:104px;height:104px;margin:0 auto 14px;display:grid;place-items:center;
  font-family:var(--song);font-size:56px;line-height:1;color:var(--paper);

.rankborder-huang{--rankcolor:#b08d3c}.rankborder-xuan{--rankcolor:#748a88}.rankborder-di{--rankcolor:var(--jade)}.rankborder-tian{--rankcolor:var(--gold)}

.star-shop-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--paper-dim);border:1px solid var(--line-soft);padding:8px 10px;margin-top:12px}

/* ——— 助战 ——— */
.assist-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}

.owned-tag{color:var(--jade);font-size:9.5px;border:1px solid rgba(63,125,122,.44);padding:0 3px}

/* ——— 业障簿 / 家长 ——— */
.book-head{margin:18px 0 14px}
.book-title{font-family:var(--song);font-size:clamp(28px,7vw,40px);letter-spacing:.18em;font-weight:400;margin:0}

.entry{border-bottom:1px solid var(--line-soft);padding:14px 0;position:relative}
.entry .e-meta{font-size:10px;color:var(--paper-dim);letter-spacing:.1em;margin-bottom:4px}
.entry .e-q{font-size:14.5px;line-height:1.8;color:rgba(232,224,207,.9);overflow-wrap:anywhere}
.entry .e-a{color:var(--jade);font-size:13px;margin-top:4px}
.entry .e-t{color:var(--paper-dim);font-size:12px;line-height:1.75;margin-top:3px;border-left:1px solid var(--line);padding-left:9px}
.empty-box{border:1px solid var(--line-soft);padding:28px 16px;text-align:center;color:var(--paper-dim);font-size:13px;line-height:2}
.parent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);margin:16px 0}
.parent-stat{padding:14px 8px;text-align:center;border-right:1px solid var(--line-soft);min-width:0}
.parent-stat:last-child{border-right:0}
.parent-stat .v{font-family:var(--song);font-size:24px;color:var(--gold);line-height:1.2}
.parent-stat .k{font-size:10.5px;color:var(--paper-dim);letter-spacing:.08em}
.mastery{margin:8px 0}
.mastery-row{padding:8px 0;border-bottom:1px solid rgba(232,224,207,.06)}
.mastery-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--paper-dim)}
.mastery-top b{color:var(--paper);font-weight:400}
.mastery-bar{height:4px;background:rgba(232,224,207,.08);margin-top:5px;overflow:hidden}
.mastery-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));width:0}
.week-bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:114px;border-bottom:1px solid var(--line-soft);padding:0 2px 0;margin:12px 0 5px}
.wbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.wbar i{display:block;width:100%;max-width:22px;background:linear-gradient(180deg,var(--gold),rgba(63,125,122,.5));min-height:1px}
.wbar span{font-size:9px;color:var(--paper-dim);line-height:1.3}
.parent-note{font-size:10.5px;line-height:1.8;color:rgba(232,224,207,.36);margin-top:15px}
.danger-zone{border:1px solid rgba(192,57,43,.24);padding:11px;margin-top:22px}
.danger-zone .tiny{color:rgba(232,224,207,.36)}
.danger-zone .btn{margin-top:7px}

/* ——— 弹层 / 提示 / 唤灵动效 ——— */
.modal-root{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:rgba(5,4,3,.78);backdrop-filter:blur(3px);animation:inkIn .2s ease-out both}
.modal-sheet{
  width:100%;max-width:430px;max-height:88svh;overflow:auto;background:
    linear-gradient(180deg,rgba(232,224,207,.04),transparent 34%),var(--ink2);
  border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;position:relative;
  animation:inkIn .24s ease-out both;
}
.modal-sheet::before{content:"";position:absolute;inset:5px;border:1px solid rgba(201,162,39,.1);pointer-events:none}
.modal-close{position:sticky;top:0;float:right;z-index:2;margin:-8px -8px 0 0}
.modal-title{font-family:var(--song);font-size:23px;letter-spacing:.14em;margin:0 0 5px;font-weight:400;padding-right:30px}
.modal-kicker{font-size:10.5px;color:var(--paper-dim);letter-spacing:.18em;margin-bottom:12px}
.modal-text{font-size:13.5px;line-height:1.9;color:var(--paper-dim)}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1}
.card-detail-top{display:flex;gap:14px;align-items:flex-start}
.card-glyph{width:68px;height:92px;border:1px solid var(--rankcolor,var(--line));display:grid;place-items:center;font-family:var(--song);font-size:36px;color:var(--rankcolor,var(--gold));flex:none;background:rgba(232,224,207,.02)}
.card-detail-info{min-width:0}
.card-detail-name{font-family:var(--song);font-size:27px;letter-spacing:.1em;line-height:1.3}
.card-detail-rank{font-size:11px;letter-spacing:.16em;color:var(--rankcolor,var(--gold))}
.card-quote{border-left:2px solid var(--rankcolor,var(--gold));padding-left:10px;font-size:13px;line-height:1.8;color:var(--paper-dim);margin:13px 0}
.effect-box{border:1px solid var(--line-soft);padding:9px 10px;font-size:12px;color:var(--paper-dim);line-height:1.75}
.effect-box b{color:var(--gold);font-weight:400}
.starup-box{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.starup-box .tiny{color:var(--paper-dim)}
.fx{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center}
.summon-fx{width:194px;height:194px;display:grid;place-items:center;position:relative;background:rgba(232,224,207,.035);border:1px solid rgba(201,162,39,.2)}
.summon-fx .paper{position:absolute;inset:17px;border:1px solid rgba(232,224,207,.15);background:linear-gradient(145deg,rgba(232,224,207,.07),transparent)}
.summon-fx .seal{
  width:86px;height:86px;display:grid;place-items:center;background:var(--cinnabar);color:var(--paper);
  font-family:var(--song);font-size:34px;border:3px double rgba(243,234,216,.8);
  box-shadow:inset 0 0 0 4px var(--cinnabar),inset 0 0 0 5px rgba(243,234,216,.4);
  animation:stampIn .36s ease-out both;position:relative;z-index:2;
}
.golddust span{position:absolute;left:50%;top:50%;width:3px;height:3px;background:var(--gold);border-radius:50%;animation:dustOut .36s ease-out both}
.toast{
  position:fixed;left:50%;bottom:24px;z-index:80;transform:translateX(-50%) translateY(8px);
  max-width:calc(100% - 32px);padding:9px 15px;border:1px solid var(--line);
  background:rgba(13,11,10,.96);color:var(--paper);font-size:12.5px;letter-spacing:.06em;
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;box-shadow:var(--shadow);
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{border-color:rgba(192,57,43,.6);color:#e3b5aa}
.sweep{position:relative;overflow:hidden}
.sweep::after{
  content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(201,162,39,.12) 50%,transparent 70%);
  animation:goldSweep .4s ease-out both;pointer-events:none;
}
.stamp{animation:stampIn .36s ease-out both}

/* ——— 宽屏 / 窄屏 ——— */
@media (min-width:620px){
  .wrap{padding:28px 28px 48px}
  .options{grid-template-columns:1fr 1fr}
  .q-stem{min-height:2.8em}
  .pull-grid.many{grid-template-columns:repeat(4,minmax(0,1fr))}
  .roster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .assist-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .story-actions{flex-direction:row}
  .story-actions .btn{flex:1}
  .result-actions{grid-template-columns:1fr 1fr 1fr}
  .result-actions .span2{grid-column:auto}
  .summon-actions{grid-template-columns:1fr 1fr}
  .chapter{grid-template-columns:48px minmax(0,1fr) auto auto;padding:16px 4px}
  .ch-no{width:42px;height:42px}
  .ch-title{font-size:20px}
  .home-actions{flex-direction:row}
  .home-actions .btn{flex:1}
  .battle-top{gap:14px}
  .fighter{padding:12px 14px}
}
@media (max-width:430px){
  .wrap{padding-left:14px;padding-right:14px}
  .home{padding-left:14px;padding-right:14px}
  .title-main{letter-spacing:.09em}
  .title-sub{letter-spacing:.34em}
  .vertical-whisper{display:none}
  .verdict{width:90px;height:90px;font-size:48px}
  .resource-cell .v{font-size:15px}
  .summon-actions .btn{font-size:13px;letter-spacing:.07em}

  .card .c-name{font-size:15.5px}
  .battle-top{grid-template-columns:1fr 1fr;gap:8px}
  .fighter .f-n{font-size:14px}
  .pip{width:8px;height:13px}
  .chapter{grid-template-columns:36px minmax(0,1fr) auto;gap:10px}
  .chapter::after{display:none}
  .ch-no{width:32px;height:32px;font-size:13px}
  .ch-title{font-size:16.5px}
  .ch-meta{font-size:10.5px}
  .result-actions{grid-template-columns:1fr 1fr}
  .result-actions .span2{grid-column:1/-1}
}
@media (max-width:340px){
  .title-main{font-size:46px}
  .wrap{padding-left:12px;padding-right:12px}
  .pull-grid,.roster-grid,.assist-grid{grid-template-columns:1fr 1fr}
  .assist-slots{gap:5px}
}

<script>
/* ============================================================
   数术西行 · 天书残卷
   数据 / 出题 / 战斗 / 唤灵 / 养成 / 渲染 / 存档
   ============================================================ */
"use strict";
/* ——— 一、数据 ——— */
const SAVE_KEY = 'xiyou_shushu_v1';

  {id:'baigujing', name:'白骨精', rank:'地', faction:'妖王', assist:'crit', base:2, quote:'三张脸，一张账。'},
  {id:'longwang', name:'龙王', rank:'玄', faction:'神将', assist:'incense', base:6, quote:'水里也有账。一笔不赖。'},
  {id:'taibai', name:'太白金星', rank:'玄', faction:'神将', assist:'qi', base:1, quote:'天上事多。先算清再开口。'},
  {id:'huangfeng', name:'黄风怪', rank:'玄', faction:'妖王', assist:'crit', base:2, quote:'风迷眼，迷不了账。'},

const $ = (sel, root) => (root || document).querySelector(sel);

const shuffle = arr => {
  const a = arr.slice();

function cardStars(id){

function starMult(stars){
  return 1 + 0.2 * Math.max(0, stars - 1);
}
function starText(stars){
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= stars ? '★' : '☆';
  return s;

function needExp(level){
  return 120 + (level - 1) * 40;

function realm() {

function fmtPct(x){
  if (!Number.isFinite(x)) return '0%';
  return Math.round(x * 100) + '%';
}
function todayKey(d){
  const x = d || new Date();
  const y = x.getFullYear();
  const m = String(x.getMonth() + 1).padStart(2, '0');
  const day = String(x.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function currentWeekDays(){
  const now = new Date();
  now.setHours(12,0,0,0);
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push({key:todayKey(d), future:d > now});
  }
  return days;
}
function chineseQuestionNo(n){
  return ['一','二','三','四','五','六','七','八','九','十'][n-1] || String(n);

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return s ? m + ' 分 ' + s + ' 秒' : m + ' 分';
  const h = Math.floor(m / 60);
  const mm = m % 60;
  return h + ' 时 ' + (mm ? mm + ' 分' : '');
}

function blankState(){

function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return blankState();
    const data = JSON.parse(raw);
    const d = blankState();
    const merged = Object.assign(d, data || {});
    merged.stats = Object.assign({answers:0, correct:0, byVol:{}, daily:{}}, (data && data.stats) || {});
    merged.stats.byVol = Object.assign({}, merged.stats.byVol || {});
    merged.stats.daily = Object.assign({}, merged.stats.daily || {});
    merged.best = Object.assign({}, merged.best || {});
    merged.completed = Object.assign({}, merged.completed || {});
    merged.cards = Object.assign({}, merged.cards || {});
    merged.wrong = Array.isArray(merged.wrong) ? merged.wrong.slice(0, 80) : [];
    merged.assists = Array.isArray(merged.assists) ? merged.assists.filter(id => {
      const c = cardById(id);
      return c && merged.cards[id];
    }).slice(0,3) : [];
    merged.level = clamp(Number(merged.level) || 1, 1, 9);
    merged.unlocked = clamp(Number(merged.unlocked) || 1, 1, 10);
    merged.incense = Math.max(0, Number(merged.incense) || 0);
    merged.charms = Math.max(0, Number(merged.charms) || 0);
    merged.starGlow = Math.max(0, Number(merged.starGlow) || 0);

  } catch (e) {

function recordAnswer(vol, correct, seconds){
  S.stats.answers += 1;
  if (correct) S.stats.correct += 1;
  const bv = byVolStat(vol);
  bv.a += 1;
  if (correct) bv.c += 1;
  const key = todayKey();
  S.stats.daily[key] = Number(S.stats.daily[key] || 0) + Math.max(0, Math.min(QUESTION_SECONDS, seconds));
  const keys = Object.keys(S.stats.daily).sort();
  while (keys.length > 30) {
    delete S.stats.daily[keys.shift()];
  }

function addWrong(q, vol, picked){

    answer:q.options[q.ans],
    explain:q.explain,

/* ——— 养成：九重境界 ——— */
function gainExp(amount){
  let gained = 0;
  let levels = [];
  S.exp += amount;
  while (S.level < 9 && S.exp >= needExp(S.level)) {
    S.exp -= needExp(S.level);
    S.level += 1;
    gained += 1;
    levels.push(REALMS[S.level - 1]);
  }
  if (S.level >= 9) S.exp = Math.min(S.exp, needExp(9));
  return {gained, levels};
}

let __qid = 0;

function uniqueWrongs(correct, candidates, count){
  count = count || 3;
  const out = [];
  for (const c of candidates) {
    const t = String(c);
    if (t !== String(correct) && !out.includes(t)) out.push(t);
    if (out.length >= count) break;
  }
  return out;
}
function makeQ(stem, correct, wrongs, explain, sub){
  const good = String(correct);
  const seen = new Set([good]);
  const pool = [good];
  for (const w of wrongs) {
    const t = String(w);
    if (!seen.has(t)) {
      seen.add(t);
      pool.push(t);
    }
  }
  const numeric = Number(good);
  if (Number.isFinite(numeric) && !/[^\d.-]/.test(good)) {
    const deltas = [1, 10, 100, 1000, -1, -10, -100, -1000];
    for (const d of deltas) {
      if (pool.length >= 4) break;
      const v = numeric + d;
      if (v < 0) continue;
      const t = String(v);
      if (!seen.has(t)) {
        seen.add(t);
        pool.push(t);
      }
    }
  }
  while (pool.length < 4) {
    const t = pool.length === 1 ? '以上都不对' : '无法确定';
    if (!seen.has(t)) {
      seen.add(t);
      pool.push(t);
    } else {
      pool.push('——');
    }
  }
  const options = shuffle(pool.slice(0,4));
  return {
    id:++__qid,
    stem:String(stem),
    options,
    ans:options.indexOf(good),

const VOL_GENS = {
  1:[v1_add, v1_sub, v1_missing, v1_word, v1_multi, v1_compare, v1_zero],
  2:[v2_three, v2_two, v2_zero, v2_word, v2_missing, v2_compare, v2_multi],

  4:[v4_multiple, v4_inverse, v4_ratio, v4_multi, v4_more, v4_total, v4_diff],
  5:[v5_elapsed, v5_end, v5_start, v5_convert, v5_feb, v5_weekday, v5_clock24],
  6:[v6_km, v6_m, v6_kg, v6_t, v6_compare, v6_bridge, v6_length],
  7:[v7_rect, v7_square, v7_side, v7_fence, v7_cut, v7_rope, v7_which],

  10:[v10_two, v10_decadd, v10_decsub, v10_comb, v10_zero, v10_mixed, v10_money]
};

function buildQuestions(vol, count){
  const gens = shuffle(VOL_GENS[vol] || []).slice(0, count);
  const out = [];
  const stems = new Set();
  for (let i = 0; i < gens.length; i++) {
    let q = null;
    for (let t = 0; t < 14; t++) {
      const made = gens[i]();
      if (!stems.has(made.stem) && made.ans >= 0) {
        q = made;
        break;
      }
    }
    if (!q) q = gens[i]();
    stems.add(q.stem);
    q.vol = vol;
    q.topic = VOLUMES[vol - 1].topic;
    out.push(q);
  }
  return out;
}

/* ——— 五、声与影 ——— */
let AC = null;
let toastTimer = null;

function initAudio(){
  if (AC) {
    if (AC.state === 'suspended') AC.resume().catch(() => {});
    return;
  }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try { AC = new Ctx(); } catch (e) { AC = null; }
}
function tone(freq, dur, type, volume, delay){
  if (!S || !S.audio) return;
  initAudio();
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume || 0.04), t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(0.05, dur || 0.16));
  osc.connect(gain).connect(AC.destination);
  osc.start(t0);
  osc.stop(t0 + Math.max(0.06, dur || 0.16) + 0.03);
}
function sfx(kind){
  if (!S || !S.audio) return;
  if (kind === 'good') {
    tone(523.25, .13, 'sine', .035, 0);
    tone(783.99, .18, 'sine', .03, .09);
  } else if (kind === 'crit') {
    tone(659.25, .1, 'triangle', .04, 0);
    tone(987.77, .16, 'triangle', .035, .08);
    tone(1318.5, .18, 'sine', .025, .16);
  } else if (kind === 'bad') {
    tone(146.83, .18, 'sine', .045, 0);
    tone(110, .22, 'sine', .035, .1);
  } else if (kind === 'stamp') {
    tone(92.5, .15, 'sine', .05, 0);
    tone(196, .12, 'triangle', .025, .04);
  } else if (kind === 'tap') {
    tone(392, .055, 'sine', .018, 0);
  }
}
function toast(msg, warn){
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (warn ? ' warn' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2200);
}
function toggleAudio(){
  S.audio = !S.audio;
  if (S.audio) {
    initAudio();
    sfx('tap');
  }
  save();
  renderCurrent();
  toast(S.audio ? '音已开。轻。' : '音已关。');
}

/* ——— 六、战斗 ——— */
let B = null;

function startBattle(vol){
  const v = VOLUMES[vol - 1];
  if (!v) return;
  const totals = assistTotals();
  const qs = buildQuestions(vol, 7);
  B = {
    token: Date.now() + Math.random(),
    vol,
    qs,
    idx: 0,
    enemyQi: v.qi,
    enemyQiMax: v.qi,
    playerQi: MAX_QI + totals.qi,
    playerQiMax: MAX_QI + totals.qi,
    crit: 0.05 + totals.crit / 100,
    incenseBoost: totals.incense / 100,
    combo: 0,
    maxCombo: 0,
    correct: 0,
    mistakes: [],
    earned: 0,
    picked: null,
    locked: false,
    feedback: null,
    timeLeft: QUESTION_SECONDS,
    questionStart: 0,
    timer: null,
    finished: false,
    result: null
  };
  U.view = 'battle';
  setView(renderBattle());
  beginTimer();
}
function enemyAlive(){
  return B && B.enemyQi > 0;
}
function beginTimer(keep){
  if (!B) return;
  clearInterval(B.timer);
  if (!keep) B.timeLeft = QUESTION_SECONDS;
  B.questionStart = performance.now() - (QUESTION_SECONDS - B.timeLeft) * 1000;
  B.locked = false;
  updateTimerUI();
  B.timer = setInterval(() => {
    if (!B || B.locked) return;
    const spent = (performance.now() - B.questionStart) / 1000;
    B.timeLeft = Math.max(0, QUESTION_SECONDS - spent);
    updateTimerUI();
    if (B.timeLeft <= 0.05) {
      clearInterval(B.timer);
      B.timer = null;
      answerQuestion(-1, true);
    }
  }, 80);
}
function pauseBattleClock(){
  if (U.view !== 'battle' || !B || B.locked || B.finished || !B.timer) return;
  const spent = (performance.now() - B.questionStart) / 1000;
  B.timeLeft = Math.max(0, QUESTION_SECONDS - spent);
  clearInterval(B.timer);
  B.timer = null;
  updateTimerUI();
}
function resumeBattleClock(){
  if (U.view !== 'battle' || !B || B.locked || B.finished || B.timer) return;
  if (B.timeLeft <= 0.05) return;
  beginTimer(true);
}
function updateTimerUI(){
  if (!B) return;
  const fill = $('#timerFill');
  const num = $('#timerNum');
  if (fill) {
    const pct = clamp(B.timeLeft / QUESTION_SECONDS, 0, 1);
    fill.style.width = (pct * 100).toFixed(2) + '%';
    fill.classList.toggle('low', B.timeLeft <= 15);
  }
  if (num) num.textContent = Math.max(0, Math.ceil(B.timeLeft)) + ' 息';
}
function answerQuestion(opt, timeout){
  if (!B || B.locked || B.finished) return;
  B.locked = true;
  clearInterval(B.timer);
  B.timer = null;
  const q = B.qs[B.idx];
  const spent = timeout ? QUESTION_SECONDS : clamp((performance.now() - B.questionStart) / 1000, 0, QUESTION_SECONDS);
  B.timeLeft = Math.max(0, QUESTION_SECONDS - spent);
  updateTimerUI();
  B.picked = opt;
  if (opt === q.ans) {
    B.combo += 1;
    B.maxCombo = Math.max(B.maxCombo, B.combo);
    B.correct += 1;
    const crit = Math.random() < B.crit;
    const dmg = crit ? 2 : 1;
    B.enemyQi = Math.max(0, B.enemyQi - dmg);
    const hit = Math.round((8 + B.vol) * (1 + Math.min(B.combo, 10) * 0.1));
    B.earned += hit;
    recordAnswer(B.vol, true, spent);
    const line = crit ? '会心。两击。' : (B.combo >= 3 ? '有点意思了。' : pick(RIGHT_LINES));
    B.feedback = {
      type:'good',
      line,
      crit,
      dmg,
      hit,
      enemyDown:B.enemyQi <= 0,
      explain:''
    };
    sfx(crit ? 'crit' : 'good');
    save();
    setView(renderBattle());
    const token = B.token;
    setTimeout(() => {
      if (!B || B.token !== token || B.finished) return;
      if (B.idx >= B.qs.length - 1) {
        setTimeout(() => { if (B && B.token === token) finishBattle(); }, 430);
      } else {
        nextQuestion();
      }
    }, 620);
  } else {
    const wasCombo = B.combo;
    B.combo = 0;
    const counter = enemyAlive();
    if (counter) B.playerQi = Math.max(0, B.playerQi - 1);
    recordAnswer(B.vol, false, spent);
    addWrong(q, B.vol, opt >= 0 ? q.options[opt] : '未答');
    B.mistakes.push({
      stem:q.stem,
      answer:q.options[q.ans],
      explain:q.explain,
      picked:opt >= 0 ? q.options[opt] : '未答',
      timeout:!!timeout
    });
    const defeated = B.playerQi <= 0;
    B.feedback = {
      type:'bad',
      line: timeout ? '慢了一步。' : pick(WRONG_LINES),
      explain:q.explain,
      counter,
      wasCombo,
      defeated
    };
    sfx('bad');
    save();
    setView(renderBattle());
  }
}
function nextQuestion(){
  if (!B || B.finished) return;
  if (B.idx >= B.qs.length - 1) {
    finishBattle();
    return;
  }
  B.idx += 1;
  B.picked = null;
  B.feedback = null;
  B.locked = false;
  B.timeLeft = QUESTION_SECONDS;
  setView(renderBattle());
  beginTimer();
}
function finishBattle(){
  if (!B || B.finished) return;
  B.finished = true;
  clearInterval(B.timer);
  B.timer = null;
  const win = B.enemyQi <= 0 && B.playerQi > 0;
  const stars = win ? (B.mistakes.length === 0 ? 3 : (B.mistakes.length <= 2 ? 2 : 1)) : 0;
  const first = win && !S.completed[B.vol];
  const baseIncense = win ? 60 + B.vol * 15 + stars * 20 : 0;
  const earnedIncense = Math.round(B.earned * (1 + B.incenseBoost));
  const expGain = win ? 80 + B.vol * 15 + stars * 25 : 0;
  S.incense += earnedIncense + baseIncense;
  let levelInfo = {gained:0, levels:[]};
  if (win) {
    levelInfo = gainExp(expGain);
    const oldBest = currentStars(B.vol);
    if (stars > oldBest) S.best[B.vol] = stars;
    if (!S.best[B.vol]) S.best[B.vol] = stars;
    S.completed[B.vol] = true;
    if (B.vol < 10) S.unlocked = Math.max(S.unlocked, B.vol + 1);
    if (first) S.charms += 1;
  }
  const reason = win ? '' : (B.playerQi <= 0 ? '真气耗尽。' : '七问已尽，妖气未散。');
  B.result = {
    win,
    stars,
    first,
    reason,
    baseIncense,
    earnedIncense,
    expGain,
    levelInfo,
    mistakes:B.mistakes.slice(),
    vol:B.vol,
    final:win && B.vol === 10 && allCleared()
  };
  save();
  U.view = 'result';
  setView(renderResult());
}

/* ——— 七、唤灵 ——— */
let U = {view:'home', storyVol:1, pullResults:[], animating:false};

function weightedRank(){
  const r = Math.random();
  if (r < 0.02) return '天';
  if (r < 0.15) return '地';
  if (r < 0.50) return '玄';
  return '黄';
}
function randomCardOfRank(rank){
  const pool = CARDS.filter(c => c.rank === rank);
  return pool.length ? pick(pool) : pick(CARDS);
}
function rollCard(){
  S.pulls += 1;
  S.pity += 1;
  let rank;
  if (S.pity >= 80) rank = '天';
  else rank = weightedRank();
  if (rank === '天') S.pity = 0;
  return randomCardOfRank(rank);
}
function pullCost(n, charm){
  if (charm) return n;
  return n === 1 ? 100 : 900;
}
function doPull(n, charm){
  if (U.animating) return;
  if (n !== 1 && n !== 10) return;
  const cost = pullCost(n, charm);
  if (charm) {
    if (S.charms < cost) { toast('请神符不够。', true); return; }
    S.charms -= cost;
  } else {
    if (S.incense < cost) { toast('香火不够。八戒不赊账。', true); return; }
    S.incense -= cost;
  }
  const picks = [];
  for (let i = 0; i < n; i++) picks.push(rollCard());
  if (n === 10 && !picks.some(c => rankOrder(c.rank) >= 3)) {
    picks[picks.length - 1] = randomCardOfRank('地');
  }
  const results = [];
  for (const card of picks) {
    if (S.cards[card.id]) {
      S.cards[card.id].stars = clamp(Number(S.cards[card.id].stars) || 1, 1, 5);
      const shards = RANK_META[card.rank].dupe;
      S.starGlow += shards;
      results.push({id:card.id, isNew:false, shards});
    } else {
      S.cards[card.id] = {stars:1};
      results.push({id:card.id, isNew:true, shards:0});
    }
  }
  U.pullResults = results;
  U.animating = true;
  save();
  sfx('stamp');
  const dust = Array.from({length:14}, (_, i) => {
    const angle = (Math.PI * 2 * i) / 14 + Math.random() * .5;
    const dist = 58 + Math.random() * 45;
    return `<span style="--dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px;animation-delay:${(Math.random() * .05).toFixed(2)}s"></span>`;
  }).join('');
  const fx = $('#fx');
  fx.innerHTML = `<div class="summon-fx"><div class="paper"></div><div class="golddust">${dust}</div><div class="seal">请</div></div>`;
  setTimeout(() => {
    if (!U.animating) return;
    $('#fx').innerHTML = '';
    U.animating = false;
    if (U.view === 'summon') setView(renderSummon());
  }, 380);
}
/* ——— 养成：星阶与助战 ——— */
function starCost(card, stars){
  return RANK_META[card.rank].dupe * stars;
}
function upgradeCard(id){
  const c = cardById(id);
  if (!c || !S.cards[id]) return;
  const stars = clamp(S.cards[id].stars || 1, 1, 5);
  if (stars >= 5) { toast('五星已满。'); return; }
  const cost = starCost(c, stars);
  if (S.starGlow < cost) {
    toast('星辉不够。还差 ' + (cost - S.starGlow) + '。', true);
    return;
  }
  S.starGlow -= cost;
  S.cards[id].stars = stars + 1;
  sfx('stamp');
  save();
  renderCurrent();
  if (U.modalCard === id) openCard(id);
  toast(c.name + ' 升至 ' + (stars + 1) + ' 星。');
}
function toggleAssist(id){
  const c = cardById(id);
  if (!c || !S.cards[id]) return;
  const at = S.assists.indexOf(id);
  if (at >= 0) {
    S.assists.splice(at, 1);
    toast('撤下 ' + c.name + '。');
  } else {
    if (S.assists.length >= 3) {
      toast('三席已满。先撤一位。', true);
      return;
    }
    S.assists.push(id);
    toast(c.name + ' 入席。');
  }
  save();
  sfx('tap');
  renderCurrent();
  if (U.modalCard === id) openCard(id);
}

  const v = c.base * starMult(stars);
  const n = Math.round(v * 10) / 10;
  if (c.assist === 'incense') return '香火 +' + n + '%';
  if (c.assist === 'crit') return '会心 +' + n + '%';
  return '真气上限 +' + n;
}
function pips(cur, max){
  let h = '';

        <button class="btn btn-ghost" data-act="toJourney">回路引</button>`;
    } else {
      actions = `<button class="btn btn-main span2" data-act="toJourney">收笔 · 回路引</button>
        <button class="btn btn-ghost" data-act="retry">重走此卷</button>
        <button class="btn btn-ghost" data-act="summon">去唤灵</button>`;
    }
  } else {
    actions = `<button class="btn btn-main span2" data-act="retry">再来一次</button>
      <button class="btn btn-ghost" data-act="toJourney">回路引</button>
      <button class="btn btn-ghost" data-act="sins">看业障簿</button>`;
  }
  return `<div class="wrap result">
    <div class="verdict-wrap">
      <div class="verdict ${win ? '' : 'lose'}">${win ? '胜' : '败'}</div>
      <div class="stars">${stars}</div>
      <h2 class="result-title">${title}</h2>
      <div class="result-sub">${sub}</div>
    </div>
    <div class="result-close">${esc(closeLine)}</div>
    ${hook}
    ${reward}
    ${levelNote}
    <div class="tiny center mt12" style="color:rgba(232,224,207,.36)">${win ? '天书一页已归位。' : (r.reason || '') + ' 香火未扣，重来便是。'}</div>
    ${mistakes}
    <div class="result-actions">${actions}</div>
    <div class="footer-small"><span class="tiny">卷中进度已存。</span><button class="linkish parent-link" data-act="sins">业障簿</button></div>
  </div>`;
}
function renderSummon(){
  const rates = ['天','地','玄','黄'].map(r => `<div class="prob"><span class="r ${RANK_META[r].cls}">${r}</span><span class="p">${Math.round(RANK_META[r].prob * 100)}%</span></div>`).join('');
  const pityLeft = Math.max(0, 80 - S.pity);
  const results = U.pullResults.length
    ? `<div class="pull-result-title sweep"><h3>本次请神 · ${U.pullResults.length} 席</h3><button class="linkish" data-act="clearPull">收了</button></div>
      <div class="pull-grid ${U.pullResults.length > 4 ? 'many' : ''}">${U.pullResults.map(r => {
        const c = cardById(r.id);
        return c ? cardHtml(c, {result:r}) : '';
      }).join('')}</div>`
    : '';
  const roster = CARDS.slice().sort((a, b) => rankOrder(b.rank) - rankOrder(a.rank) || a.name.localeCompare(b.name, 'zh')).map(c => cardHtml(c)).join('');
  const dis = U.animating ? 'disabled' : '';
  return `<div class="wrap">
    ${header({act:'toJourney', label:'回'})}
    ${resourceStrip()}
    <div class="shop-head">
      <div>
        <h2 class="shop-title">唤灵</h2>
        <div class="shop-sub">八戒在黑市摆摊。香火从斗法来，不收钱。</div>
      </div>
      <div class="seal-corner" style="position:static;width:48px;height:48px;font-size:15px;flex:none"><span>请<br>神</span></div>
    </div>
    <div class="prob-panel">
      <div class="spread"><span class="tiny gold">概率公示</span><span class="tiny">出天即重置</span></div>
      <div class="prob-grid">${rates}</div>
      <div class="prob-note">八十请必出<b>天</b>。十连必见<b>地</b>。当前距天保底 <b>${pityLeft}</b> 请。请神符可直接抵一请；十请耗十符。</div>
    </div>
    <div class="summon-actions">
      <button class="btn btn-main" data-act="pull" data-n="1" data-charm="0" ${dis}>一请<small>100 香火 · 一席</small></button>
      <button class="btn btn-gold" data-act="pull" data-n="10" data-charm="0" ${dis}>十请<small>900 香火 · 必见地</small></button>
    </div>
    <div class="charm-row">
      <button class="linkish" data-act="pull" data-n="1" data-charm="1" ${S.charms < 1 || U.animating ? 'disabled' : ''}>以符一请 · 1 符</button>
      <button class="linkish" data-act="pull" data-n="10" data-charm="1" ${S.charms < 10 || U.animating ? 'disabled' : ''}>以符十请 · 10 符</button>
    </div>
    ${results}
    <div class="star-shop-line"><span>星辉 · ${S.starGlow}</span><span class="tiny">重复得星辉：黄 2 / 玄 4 / 地 8 / 天 15。一至五星，每星助战 +20%。</span></div>
    <div class="roster-head"><h3>图鉴 · 二十四席</h3><span class="tiny">${Object.keys(S.cards).length} / 24</span></div>
    <div class="roster-grid">${roster}</div>
    <div class="footer-small"><span class="tiny">香火与符皆不可用钱买。</span><button class="linkish" data-act="assist">去排助战</button></div>
  </div>`;
}
function renderAssist(){
  const totals = assistTotals();
  const slots = [0,1,2].map(i => {
    const id = S.assists[i];
    const c = id ? cardById(id) : null;
    if (!c) return `<button class="slot" data-act="assist">空席<br><span class="tiny">从下方择将</span></button>`;
    const stars = cardStars(id);
    return `<button class="slot filled" data-act="toggleAssist" data-id="${c.id}">
      <span class="s-name">${esc(c.name)}</span>
      <span class="tiny">${starText(stars)}</span>
      <span class="s-eff">${effectText(c, stars)}</span>
    </button>`;
  }).join('');
  const owned = CARDS.filter(c => S.cards[c.id]).sort((a,b) => rankOrder(b.rank) - rankOrder(a.rank));
  const grid = owned.length ? owned.map(c => {
    const selected = S.assists.includes(c.id);
    return `<button class="card ${RANK_META[c.rank].border}" data-act="toggleAssist" data-id="${c.id}" style="${selected ? 'border-color:var(--gold);background:rgba(201,162,39,.055)' : ''}">
      <span class="c-rank">${c.rank}</span>
      <span class="c-big">${esc(c.name.slice(0,1))}</span>
      <span class="c-name">${esc(c.name)} ${selected ? '<span class="owned-tag">在席</span>' : ''}</span>
      <span class="c-foot"><span>${effectText(c, cardStars(c.id))}</span><span class="c-stars">${starText(cardStars(c.id))}</span></span>
    </button>`;
  }).join('') : `<div class="empty-box">尚无神将。<br><button class="linkish mt12" data-act="summon">去八戒摊上看看</button></div>`;
  return `<div class="wrap">
    ${header({act:'toJourney', label:'回'})}
    <div class="book-head"><h2 class="book-title">助战</h2><div class="book-sub">三席。香火、会心、真气，各取所长。</div></div>
    <div class="assist-slots">${slots}</div>
    <div class="assist-bonus">
      <div class="ab-row"><span>香火增益</span><b>+${Math.round(totals.incense)}%</b></div>
      <div class="ab-row"><span>会心加成</span><b>+${Math.round(totals.crit)}%</b></div>
      <div class="ab-row"><span>真气上限</span><b>+${totals.qi}</b></div>
    </div>
    <div class="spread mt18"><span class="tiny gold">已收神将 · ${owned.length}</span><span class="tiny">点将入席。再点撤下。</span></div>
    <div class="assist-grid">${grid}</div>
    <div class="footer-small"><span class="tiny">星阶越高，助战越强。</span><button class="linkish" data-act="summon">去唤灵</button></div>
  </div>`;
}
function renderSins(){
  const list = S.wrong.slice(0, 50).map(w => {
    const v = VOLUMES[(w.vol || 1) - 1];
    return `<div class="entry">
      <div class="e-meta">卷 ${CN_NUM[w.vol || 1]} · ${esc(v ? v.topic : '')} · ${new Date(w.time || Date.now()).toLocaleDateString('zh-CN')}</div>
      <div class="e-q">${esc(w.stem)}</div>
      <div class="e-a">正解：${esc(w.answer)}${w.picked ? `　你选：${esc(w.picked)}` : ''}</div>
      <div class="e-t">${esc(w.explain)}</div>
    </div>`;
  }).join('');
  return `<div class="wrap">
    ${header({act:'toJourney', label:'回'})}
    <div class="book-head"><h2 class="book-title">业障簿</h2><div class="book-sub">错处不藏。看一遍，再走。</div></div>
    ${list ? list : `<div class="empty-box">簿上无字。<br><span class="tiny">还没算错过。或者，还没算过。</span></div>`}
    ${S.wrong.length > 50 ? `<div class="tiny center mt18" style="color:rgba(232,224,207,.36)">只录最近五十条。</div>` : ''}
    <div class="footer-small"><span class="tiny">错题不扣香火。</span><button class="linkish" data-act="toJourney">回</button></div>
  </div>`;
}
function renderParent(){
  const answers = S.stats.answers || 0;
  const correct = S.stats.correct || 0;
  const acc = answers ? correct / answers : 0;
  const week = weekSeconds();
  const days = currentWeekDays().map(d => ({key:d.key, sec:Number(S.stats.daily[d.key] || 0)}));
  const maxDay = Math.max(60, ...days.map(d => d.sec));
  const bars = days.map((d, i) => {
    const names = ['一','二','三','四','五','六','日'];
    const h = d.sec ? Math.max(3, Math.round(d.sec / maxDay * 100)) : 1;
    const label = !d.sec ? '0分' : (d.sec < 60 ? d.sec + '秒' : Math.round(d.sec / 60) + '分');
    return `<div class="wbar"><i style="height:${h}%"></i><span>${names[i]}<br>${label}</span></div>`;
  }).join('');
  const mastery = VOLUMES.map(v => {
    const s = S.stats.byVol[v.n] || {a:0, c:0};
    const pct = s.a ? Math.round(s.c / s.a * 100) : 0;
    return `<div class="mastery-row">
      <div class="mastery-top"><span><b>${esc(v.topic)}</b> <span class="tiny">卷${CN_NUM[v.n]}</span></span><span>${s.a ? pct + '% · ' + s.c + '/' + s.a : '未答'}</span></div>
      <div class="mastery-bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('');
  return `<div class="wrap">
    ${header({act:'toJourney', label:'回'})}
    <div class="book-head"><h2 class="book-title">家长页</h2><div class="book-sub">只记数，不问真名。数据只在此机。</div></div>
    <div class="parent-grid">
      <div class="parent-stat"><div class="v">${answers}</div><div class="k">总答题</div></div>
      <div class="parent-stat"><div class="v">${answers ? fmtPct(acc) : '—'}</div><div class="k">正确率</div></div>
      <div class="parent-stat"><div class="v">${fmtDuration(week)}</div><div class="k">本周用时</div></div>
    </div>
    <div class="spread mt18"><span class="tiny gold">本周 · 斗法用时</span><span class="tiny">共 ${fmtDuration(week)}</span></div>
    <div class="week-bars">${bars}</div>
    <div class="spread mt18"><span class="tiny gold">各知识点掌握度</span><span class="tiny">按答题计</span></div>
    <div class="mastery">${mastery}</div>
    <div class="parent-note">只统计斗法答题，不计停留与页面浏览。答错不扣香火，不锁章节。本周用时按周一至周日累计。</div>
    <div class="danger-zone"><div class="tiny">此卷存于此机。抹去后，法号、进度、神将一并散尽。</div><button class="btn btn-sm btn-ghost" data-act="resetAsk">抹去此卷</button></div>
    <div class="footer-small"><span class="tiny">数术西行 · 天书残卷</span><button class="linkish" data-act="toJourney">回</button></div>
  </div>`;
}
function renderCurrent(){
  if (U.view === 'home') setView(renderHome());
  else if (U.view === 'journey') setView(renderJourney());
  else if (U.view === 'story') setView(renderStory());
  else if (U.view === 'battle') setView(renderBattle());
  else if (U.view === 'result') setView(renderResult());
  else if (U.view === 'summon') setView(renderSummon());
  else if (U.view === 'assist') setView(renderAssist());
  else if (U.view === 'sins') setView(renderSins());
  else if (U.view === 'parent') setView(renderParent());
  else setView(renderHome());
}
function setView(html){
  const root = $('#view');
  if (!root) return;
  root.innerHTML = html;
  window.scrollTo(0, 0);
}
function showHome(){ U.view = 'home'; setView(renderHome()); }
function showJourney(){ B = null; U.view = 'journey'; setView(renderJourney()); }
function showStory(n){
  const v = VOLUMES[n - 1];
  if (!v) return showJourney();
  if (n > S.unlocked) { toast('前卷未破。', true); return; }
  U.storyVol = n;
  U.view = 'story';
  setView(renderStory());
}
function showSummon(){
  U.view = 'summon';
  setView(renderSummon());
}
function showAssist(){
  U.view = 'assist';
  setView(renderAssist());
}
function showSins(){
  U.view = 'sins';
  setView(renderSins());
}
function showParent(){
  U.view = 'parent';
  setView(renderParent());
}
function showModal(html){
  pauseBattleClock();
  const m = $('#modal');
  m.innerHTML = `<div class="modal-sheet">${html}</div>`;
  m.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  const m = $('#modal');
  m.hidden = true;
  m.innerHTML = '';
  U.modalCard = null;
  document.body.style.overflow = '';
  resumeBattleClock();
}
function showConfirm(title, text, action, label, danger){
  U.confirmAction = action;
  showModal(`<button class="icon-btn modal-close" data-act="closeModal">闭</button>
    <h3 class="modal-title">${esc(title)}</h3>
    <div class="modal-text">${esc(text)}</div>
    <div class="modal-actions">
      <button class="btn ${danger ? 'btn-main' : ''}" data-act="confirmYes">${esc(label || '就此定下')}</button>
      <button class="btn btn-ghost" data-act="closeModal">再想想</button>
    </div>`);
}
function openCard(id){
  const c = cardById(id);
  if (!c) return;
  U.modalCard = id;
  const own = !!S.cards[id];
  const stars = own ? clamp(S.cards[id].stars || 1, 1, 5) : 0;
  const selected = S.assists.includes(id);
  const cost = own && stars < 5 ? starCost(c, stars) : 0;
  const nextText = own && stars < 5 ? effectText(c, stars + 1) : '';
  const assistAction = own
    ? `<button class="btn ${selected ? 'btn-ghost' : 'btn-main'}" data-act="toggleAssist" data-id="${id}">${selected ? '撤出席位' : '入席助战'}</button>`
    : `<button class="btn btn-ghost" data-act="summon">去唤灵</button>`;
  const upAction = own && stars < 5
    ? `<button class="btn btn-gold" data-act="starUp" data-id="${id}" ${S.starGlow < cost ? 'disabled' : ''}>升星 · 星辉 ${cost}</button>`
    : '';
  const color = c.rank === '天' ? '#c9a227' : c.rank === '地' ? '#3f7d7a' : c.rank === '玄' ? '#748a88' : '#b08d3c';
  showModal(`<button class="icon-btn modal-close" data-act="closeModal">闭</button>
    <div class="card-detail-top ${RANK_META[c.rank].border}" style="--rankcolor:${color}">
      <div class="card-glyph">${esc(c.name.slice(0,1))}</div>
      <div class="card-detail-info">
        <div class="card-detail-name">${esc(c.name)}</div>
        <div class="card-detail-rank">${c.rank}阶 · ${esc(c.faction)} · ${own ? starText(stars) : '未得'}</div>
      </div>
    </div>
    <div class="card-quote">「${esc(c.quote)}」</div>
    <div class="effect-box"><b>助战</b>　${own ? effectText(c, stars) : '未得此卡'}<br>
      <span class="tiny">${own ? (stars < 5 ? '下一星：' + nextText : '五星已满。') : '重复获得可转星辉：' + RANK_META[c.rank].dupe + ' 枚。'}</span>
    </div>
    <div class="starup-box"><span class="tiny">星辉 ${S.starGlow}${own && stars < 5 ? ' · 升星需 ' + cost : ''}</span></div>
    <div class="modal-actions">${assistAction}${upAction}</div>`);
}

/* ——— 九、事件 ——— */
function startGame(){
  const input = $('#nameInput');
  let name = input ? input.value.trim() : '';
  name = Array.from(name).slice(0, 6).join('');
  S.name = name || '无名';
  S.started = true;
  save();
  sfx('stamp');
  showJourney();
}
function resetGame(){
  const audio = S.audio;
  S = blankState();
  S.audio = audio;
  U = {view:'home', storyVol:1, pullResults:[], animating:false};
  save();
  showHome();
}
function quitBattle(){
  if (B && B.timer) clearInterval(B.timer);
  B = null;
  showJourney();
}
function handleAction(act, el){
  const id = el ? el.getAttribute('data-id') : null;
  const n = el ? Number(el.getAttribute('data-n') || 0) : 0;
  const charm = el ? el.getAttribute('data-charm') === '1' : false;
  if (act === 'start') return startGame();
  if (act === 'continue') {
    if (!S.started) return showHome();
    return showJourney();
  }
  if (act === 'newGame') {
    return showConfirm('另起一卷', '另起一卷，旧卷的进度、神将与业障都会散。', resetGame, '另起', true);
  }
  if (act === 'toJourney') return showJourney();
  if (act === 'home') return showHome();
  if (act === 'locked') return toast('前卷未破。回头把那七问算完。', true);
  if (act === 'chapter') {
    const vol = Number(el.getAttribute('data-vol'));
    if (vol > S.unlocked) return toast('前卷未破。', true);
    return showStory(vol);
  }
  if (act === 'beginBattle') return startBattle(U.storyVol);
  if (act === 'answer') {
    if (U.view !== 'battle' || !B || B.locked || B.finished) return;
    return answerQuestion(Number(el.getAttribute('data-opt')), false);
  }
  if (act === 'nextQ') return nextQuestion();
  if (act === 'showResult') return finishBattle();
  if (act === 'retry') {
    const vol = B && B.result ? B.result.vol : U.storyVol;
    return startBattle(vol);
  }
  if (act === 'nextChapter') {
    if (!B || !B.result || !B.result.win) return;
    const next = B.result.vol + 1;
    if (next > 10) return showJourney();
    return showStory(next);
  }
  if (act === 'battleQuit') {
    return showConfirm('收棍', '此阵不算。算到一半的，不留。', quitBattle, '收棍', true);
  }
  if (act === 'summon') { closeModal(); return showSummon(); }
  if (act === 'assist') { closeModal(); return showAssist(); }
  if (act === 'sins') return showSins();
  if (act === 'parent') return showParent();
  if (act === 'pull') return doPull(n, charm);
  if (act === 'clearPull') { U.pullResults = []; return setView(renderSummon()); }
  if (act === 'card') return openCard(id);
  if (act === 'toggleAssist') return toggleAssist(id);
  if (act === 'starUp') return upgradeCard(id);
  if (act === 'toggleAudio') return toggleAudio();
  if (act === 'resetAsk') {
    return showConfirm('抹去此卷', '法号、进度、神将、星辉都会散尽。不能收回。', resetGame, '抹去', true);
  }
  if (act === 'closeModal') return closeModal();
  if (act === 'confirmYes') {
    const fn = U.confirmAction;
    U.confirmAction = null;
    closeModal();
    if (typeof fn === 'function') fn();
    return;
  }
}
function onClick(e){
  if (e.target && e.target.id === 'modal') {
    closeModal();
    return;
  }
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  const act = el.getAttribute('data-act');
  if (!act) return;
  handleAction(act, el);
}
function onKey(e){
  if (e.key === 'Escape') {
    if (!$('#modal').hidden) closeModal();
    return;
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'nameInput') {
    e.preventDefault();
    startGame();
    return;
  }
  if (U.view === 'battle' && B && !B.locked && !B.finished && $('#modal').hidden) {
    const map = {'1':0,'2':1,'3':2,'4':3,'甲':0,'乙':1,'丙':2,'丁':3};
    if (Object.prototype.hasOwnProperty.call(map, e.key)) {
      e.preventDefault();
      answerQuestion(map[e.key], false);
    }
  }
}

/* ——— 十、启动 ——— */
S = loadState();
U = {view:'home', storyVol:1, pullResults:[], animating:false};
document.addEventListener('click', onClick);
document.addEventListener('keydown', onKey);
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);
showHome();
if (!storageOK) {
  setTimeout(() => toast('此境不留字。刷新即散。', true), 700);
}

</script>
</body>
</html>
